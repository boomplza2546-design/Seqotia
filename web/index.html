<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Seqotia — an elegant AI document workspace.">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="seqotia">
    <title>Seqotia</title>
    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- This script installs service_worker.js to provide PWA functionality to
         application. For more information, see:
         https://developers.google.com/web/fundamentals/primers/service-workers -->
    <script>
        var serviceWorkerVersion = null;
        var scriptLoaded = false;
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                var script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                loadScript('flutter_service_worker.js').then((reg) => {
                    console.log('Flutter Service Worker registered');
                });
            });
        }
    </script>
    <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
